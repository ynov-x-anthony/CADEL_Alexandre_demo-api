name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, notifier]
    permissions:
      contents: read
      packages: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Dockerfile du service
        id: df
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            echo "file=./api/Dockerfile.multi" >> "$GITHUB_OUTPUT"
          else
            echo "file=./notifier/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Login GHCR (tags seulement)
        if: env.IS_TAG == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, pour scanner)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.df.outputs.file }}
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ env.IS_TAG == 'true' && '1' || '0' }}
          format: table

      - name: Push (tags seulement)
        if: env.IS_TAG == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.df.outputs.file }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur le serveur cible
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/demo-api
            git pull
            export TAG="${{ github.ref_name }}"
            export IMAGE_PREFIX="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            docker compose pull
            docker compose up -d
            docker image prune -f
