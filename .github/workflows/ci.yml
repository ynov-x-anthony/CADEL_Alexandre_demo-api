name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, notifier]
    permissions:
      contents: read
      packages: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Dockerfile du service
        id: df
        run: |
          if [ "${{ matrix.service }}" = "api" ]; then
            echo "file=./api/Dockerfile.multi" >> "$GITHUB_OUTPUT"
          else
            echo "file=./notifier/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Login GHCR (tags seulement)
        if: env.IS_TAG == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, pour scanner)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.df.outputs.file }}
          load: true
          tags: ${{ env.IMAGE }}:ci

      - name: Scan Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ env.IS_TAG == 'true' && '1' || '0' }}
          format: table

      - name: Push (tags seulement)
        if: env.IS_TAG == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ${{ steps.df.outputs.file }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  # Deploiement SIMULE : pas de VM disponible, la stack est deployee sur le runner
  # GitHub lui-meme (meme mecanique pull + up -d, cible differente).
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de la stack
        run: |
          cp .env.example .env
          echo "TAG=${{ github.ref_name }}" >> .env
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> .env
          echo "ci-deploy-password" > secrets/db_password.txt

      - name: Déployer (pull + up -d)
        run: |
          docker compose pull
          docker compose up -d --wait
          docker compose ps

      - name: Vérifier la stack déployée
        run: |
          curl -fsS -X POST localhost:8080/products -H "Content-Type: application/json"             -d '{"name":"Clavier meca","price_cents":5900}'
          sleep 2
          docker compose logs notifier | tail -5
          docker compose logs notifier | grep -q "nouveau produit"

      - name: Nettoyage
        if: always()
        run: docker compose down -v
