services:
    api:
        build: ./api
        image: ${IMAGE_PREFIX:-demo-api}/api:${TAG:-latest}
        command: ["sh", "-c", "PGPASSWORD=$$(cat /run/secrets/db_password) exec node server.js"]
        environment:
            PGHOST: db
            PGUSER: ${POSTGRES_USER}
            PGDATABASE: ${POSTGRES_DB}
            NOTIFIER_PORT: "4000"
        secrets:
            - db_password
        ports:
            - "${API_PORT:-8080}:3000"
        depends_on:
            db:
                condition: service_healthy
        networks: [front, back]
        restart: unless-stopped

    notifier:
        build: ./notifier
        image: ${IMAGE_PREFIX:-demo-api}/notifier:${TAG:-latest}
        environment:
            PORT: "4000"
        networks: [back] # jamais expose : seul api l'appelle, par son nom de service
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        secrets:
            - db_password
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks: [back]
        restart: unless-stopped

    adminer:
        image: adminer:4
        ports:
            - "${ADMINER_PORT:-8081}:8080"
        depends_on: [db]
        networks: [front, back]
        restart: unless-stopped

secrets:
    db_password:
        file: ./secrets/db_password.txt

networks:
    front:
    back:

volumes:
    pgdata:
